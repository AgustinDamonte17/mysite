name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Do NOT enable GitHub Pages in repo Settings until Agustín explicitly oks via Chieff.
# This workflow is present but will not publish until Pages is configured.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload Pages artifact
        uses: withastro/action@v3
        with:
          path: .
          node-version: 22
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
